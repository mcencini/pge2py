name: release

# Cut a release with a tag vX.Y.Z (X.Y.Z = pge2py.__version__): push the tag,
# or create the release (and its tag) in the GitHub web interface.
# Builds the wheel (with the Octave WebAssembly build and the pinned toolboxes),
# publishes it to PyPI with a trusted publisher (no API token), and attaches the
# files to the GitHub release (creating it, with the CHANGELOG.md section, if
# it does not exist). Both events may fire for one tag: the second run finds
# the files already on PyPI and the release already there.
# A manual run only builds and checks.

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('src/pge2py/__init__.py').read())[1])")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v$version"; exit 1; }
      - name: Build assets (Octave wasm, toolboxes)
        run: python tools/build_assets.py
      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build --sdist
          python -m build --wheel   # from the checkout: the sdist leaves the assets out
      - name: Check the wheel contents
        run: python tools/check_wheel.py dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pge2py
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            awk -v v="$version" '$0 ~ "^## " {p = ($2 == v)} p && !/^## /' CHANGELOG.md > notes.md
            gh release create "$GITHUB_REF_NAME" dist/* --title "pge2py $version" --notes-file notes.md
          fi
