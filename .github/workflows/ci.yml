name: ci

on:
  push:
  pull_request:

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GNU Octave
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends octave
      - name: Build assets
        run: python tools/build_assets.py
      - name: Install and test
        run: |
          python -m pip install -e ".[test]"
          python -m pytest -q
